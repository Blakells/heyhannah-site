experience:
  - title: Documentation and Information Management Specialist
    employer: Drs. Bruce and Lee Foundation
    place: Florence, SC, hybrid
    dates: Jan 2026 – Present
    bullets:
      - Edited and refined grant documentation and supporting materials while designing and implementing a centralized SharePoint document management system for more than 30 years of organizational records.
      - Developed the information architecture, taxonomy, metadata, naming conventions, and organizational standards needed to transform a large, fragmented archive into a structured, searchable digital resource.
      - Audited, categorized, and organized historical records across physical and digital formats while establishing documentation workflows and standards to improve accessibility, retrieval, consistency, and long-term records management.
      - Applied technical writing, information architecture, and content organization principles to create a sustainable system for managing and maintaining the organization’s historical documentation.
  - title: Senior UX Writer
    employer: ACS Technologies
    place: Remote
    dates: Dec 2023 – Dec 2025
    bullets:
      - Reimagined product documentation to improve consistency, usability, and long-term maintainability across multiple SaaS products.
      - Partnered with product managers, designers, engineers, and researchers to create user-centered product content that reduced friction and improved task completion.
      - Developed voice, tone, and editorial standards to improve consistency across product experiences and customer-facing documentation and video content.
      - Planned and executed documentation strategies for new product releases within Agile development cycles.
      - Improved information architecture and content organization to help users find answers more efficiently.
      - Led organization-wide training initiatives for video content tools and AI-assisted workflows, serving as the primary point of contact for user support, troubleshooting, onboarding, and best practices.
      - Used Pendo, Sigma, and Google Analytics to evaluate user behavior and identify opportunities to improve product documentation and in-product guidance.
      - Served as the primary internal subject-matter expert for Videate AI, leading adoption across multiple teams, delivering training, troubleshooting complex issues, and collaborating directly with vendor support to improve workflows.
  - title: Junior UX Writer
    employer: ACS Technologies
    place: Remote
    dates: Aug 2021 – Dec 2023
    bullets:
      - Wrote and maintained user-centered product content for onboarding experiences, help documentation, and feature releases across multiple SaaS products.
      - Collaborated with UX designers, engineers, product managers, and researchers to simplify complex workflows into intuitive user experiences.
      - Conducted content audits and reorganized documentation to improve discoverability and reduce user confusion.
      - Applied analytics and customer feedback to continuously improve documentation quality and product guidance.
      - Created contextual help, onboarding resources, release documentation, video content, and support content aligned with user goals.
      - Established documentation and video content standards that improved consistency across products and teams.
  - title: Technical Writer
    employer: ACS Technologies
    place: Florence, SC, remote
    dates: Jan 2019 – Aug 2021
    bullets:
      - Created technical and UX documentation for SaaS applications, helping customers understand complex features and workflows.
      - Partnered with engineers and subject-matter experts to translate technical concepts into accessible documentation.
      - Developed knowledge base articles, release documentation, installation guides, help video content and user documentation.
      - Organized and maintained structured documentation using DITA XML and content management systems.
      - Participated in Agile product development, ensuring documentation evolved alongside product releases.
      - Built expertise in information architecture, structured authoring, and developer-adjacent documentation.
  - title: Technical Writing Intern
    employer: ACS Technologies
    place: ""
    dates: Jul 2018 – Jan 2019
    bullets:
      - Collaborated with senior technical writers to create and maintain customer-facing documentation for SaaS products.
      - Developed help documentation and troubleshooting/FAQ guides to support users in resolving common product issues.
      - Produced instructional micro-video content using Camtasia to complement written documentation and enhance the customer learning experience.
      - Learned structured authoring, documentation standards, and content management system workflows while contributing to ongoing documentation projects.
      - Supported documentation updates for new features, product enhancements, and software releases.
selectedProject:
  title: Integrating DocuSign with Go Method
  employer: ACS Technologies
  bullets:
    - Identified gap in customer self-service for DocuSign integration setup, which was driving support ticket volume and inconsistent adoption.
    - Collaborated with engineering and product SMEs to map the integration workflow, then authored a comprehensive step-by-step guide for administrators.
    - Reduced support inquiries, provided a scalable reference for internal teams, and established a reusable template for future integration documentation.
